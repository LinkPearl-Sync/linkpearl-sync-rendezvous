# Complément systemd de rdv.linkpearl.eorzea.events, posé par deploy.sh dans
# /etc/systemd/system/lprdv.service.d/. L'unité générique reste celle que
# tout le monde installe ; seul ce serveur tient l'autorité et porte ce nom.
[Service]
ExecStart=
ExecStart=/opt/lprdv/lprdv --port 47900 --directory-authority --public-address rdv.linkpearl.eorzea.events --label "Eorzea Events Linkpearl Primary"
